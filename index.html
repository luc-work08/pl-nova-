<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plánovač príspevkov emst</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600&display=swap">
<style>[hidden]{display:none!important}
/* Layout: list of posts on the left (by date), editor + LinkedIn preview + review thread on the right. Betón palette from the emst posts. */
:root{
  --bg:#E9E6E1; --surface:#F6F4F1; --surface-2:#E0DCD6; --field:#FFFFFF;
  --ink:#2E2C2A; --ink-2:#615C57; --ink-3:#8A847C; --line:rgba(46,44,42,.14); --line-2:rgba(46,44,42,.24);
  --accent:#C8323A; --accent-hover:#AE2A31; --on-accent:#FFFFFF;
  --st-draft:#7E786F; --st-review:#A86A12; --st-changes:#C8323A; --st-ok:#2F7A47; --st-pub:#4A4744;
  --st-draft-bg:rgba(126,120,111,.14); --st-review-bg:rgba(201,138,30,.16); --st-changes-bg:rgba(200,50,58,.12); --st-ok-bg:rgba(47,122,71,.13); --st-pub-bg:rgba(74,71,68,.12);
  --shadow:0 1px 2px rgba(46,44,42,.06),0 6px 18px rgba(46,44,42,.06);
  --f-display:"Montserrat",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-li:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1B1A; --surface:#252422; --surface-2:#302E2B; --field:#1F1E1C;
  --ink:#EDEAE5; --ink-2:#B3ADA6; --ink-3:#8C867F; --line:rgba(237,234,229,.12); --line-2:rgba(237,234,229,.22);
  --accent:#E0545B; --accent-hover:#EA6A70; --on-accent:#1C1B1A;
  --st-draft:#A8A198; --st-review:#E2A84A; --st-changes:#EF6F75; --st-ok:#6CC08A; --st-pub:#C7C1BA;
  --st-draft-bg:rgba(168,161,152,.16); --st-review-bg:rgba(226,168,74,.16); --st-changes-bg:rgba(239,111,117,.15); --st-ok-bg:rgba(108,192,138,.15); --st-pub-bg:rgba(199,193,186,.12);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1C1B1A; --surface:#252422; --surface-2:#302E2B; --field:#1F1E1C;
  --ink:#EDEAE5; --ink-2:#B3ADA6; --ink-3:#8C867F; --line:rgba(237,234,229,.12); --line-2:rgba(237,234,229,.22);
  --accent:#E0545B; --accent-hover:#EA6A70; --on-accent:#1C1B1A;
  --st-draft:#A8A198; --st-review:#E2A84A; --st-changes:#EF6F75; --st-ok:#6CC08A; --st-pub:#C7C1BA;
  --st-draft-bg:rgba(168,161,152,.16); --st-review-bg:rgba(226,168,74,.16); --st-changes-bg:rgba(239,111,117,.15); --st-ok-bg:rgba(108,192,138,.15); --st-pub-bg:rgba(199,193,186,.12);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;max-width:1320px;margin:0 auto;padding-block:22px 18px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand .bar{width:44px;height:4px;background:var(--accent);flex-shrink:0}
.brand h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(20px,2.4vw,26px);letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-family:var(--f-display);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:9px 16px;font-family:var(--f-display);font-weight:600;font-size:14px;line-height:1.2;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ok{background:var(--st-ok);border-color:var(--st-ok);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover:not(:disabled){background:var(--surface-2)}
.btn.danger{color:var(--st-changes);border-color:transparent;background:transparent}
.btn.small{padding:6px 11px;font-size:13px}

.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;max-width:1320px;margin:0 auto;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}

/* list */
.list{position:sticky;top:max(12px,env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);display:flex;flex-direction:column;overflow:hidden}
.filters{display:flex;gap:4px;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.filters button{border:0;background:transparent;border-radius:7px;padding:6px 10px;font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.filters button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}
.count{font-variant-numeric:tabular-nums;font-size:11px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--line);display:inline-flex;align-items:center;justify-content:center}
.count.hot{background:var(--accent);color:var(--on-accent)}
.listBody{overflow-y:auto;padding:6px 6px 12px}
.group{font-family:var(--f-display);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:14px 10px 6px}
.item{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;width:100%;text-align:left;border:0;background:transparent;border-radius:9px;padding:10px;align-items:start;position:relative}
.item:hover{background:var(--surface-2)}
.item[aria-current="true"]{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--accent)}
.date{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line-2);border-radius:8px;padding:5px 0 6px;background:var(--field);font-variant-numeric:tabular-nums}
.date .wd{font-family:var(--f-display);font-weight:700;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.date .dm{font-family:var(--f-display);font-weight:700;font-size:13px;line-height:1.1;white-space:nowrap}
.item .ttl{font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.item .sub{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:5px;font-size:13px;color:var(--ink-2)}
.waiting{position:absolute;top:12px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.listEmpty{padding:28px 18px;color:var(--ink-2);font-size:15px}
details.pub summary{list-style:none;cursor:pointer}
details.pub summary::-webkit-details-marker{display:none}
details.pub summary::after{content:" +";}
details.pub[open] summary::after{content:" –";}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px 2px 8px;font-family:var(--f-display);font-weight:600;font-size:11.5px;letter-spacing:.02em;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-draft{color:var(--st-draft);background:var(--st-draft-bg)}
.st-review{color:var(--st-review);background:var(--st-review-bg)}
.st-changes{color:var(--st-changes);background:var(--st-changes-bg)}
.st-ok{color:var(--st-ok);background:var(--st-ok-bg)}
.st-pub{color:var(--st-pub);background:var(--st-pub-bg)}

/* detail */
.detail{min-width:0}
.empty{padding:48px 28px;text-align:left;max-width:560px}
.empty h2{font-family:var(--f-display);font-weight:800;font-size:24px;margin:0 0 10px;letter-spacing:-.01em}
.empty ol{padding-left:20px;color:var(--ink-2);margin:0 0 20px}
.empty li{margin:6px 0}
.dHead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dHead .left{display:flex;align-items:center;gap:12px;min-width:0;flex-wrap:wrap}
.meta{font-size:13px;color:var(--ink-3)}
.back{display:none}
.flow{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.flowRow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.flowMsg{font-size:15px;color:var(--ink-2);flex:1 1 260px;min-width:0}
.flowMsg b{color:var(--ink);font-weight:600}
.flowPanel{border:1px solid var(--line-2);border-radius:10px;padding:14px;background:var(--field);display:flex;flex-direction:column;gap:10px}
.cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:24px;padding:20px}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.row2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.lab{font-family:var(--f-display);font-weight:700;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2)}
.lab .hint{font-family:var(--f-body);font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink-3);font-size:12.5px;margin-left:6px}
input[type=text],input[type=date],select,textarea{width:100%;min-width:0;border:1px solid var(--line-2);border-radius:8px;background:var(--field);padding:9px 11px;font-size:15px}
textarea{resize:vertical;line-height:1.5}
#f-text{min-height:340px;font-size:15.5px}
#f-notes{min-height:84px}
.save{font-size:12.5px;color:var(--ink-3);min-height:18px}

.photo{border:1.5px dashed var(--line-2);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;background:var(--field)}
.photo.drag{border-color:var(--accent);background:var(--st-changes-bg)}
.photo img{max-width:100%;max-height:260px;border-radius:6px;display:block;object-fit:contain;background:var(--surface-2)}
.photo .acts{display:flex;gap:8px;flex-wrap:wrap}
.photo p{margin:0;color:var(--ink-2);font-size:14px}

/* preview */
.li{background:var(--field);border:1px solid var(--line);border-radius:10px;font-family:var(--f-li);overflow:hidden}
.liHead{display:flex;gap:10px;align-items:center;padding:12px 14px 8px}
.liLogo{width:44px;height:44px;border-radius:4px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--ink);letter-spacing:-.02em;border:1px solid var(--line)}
.liName{font-weight:600;font-size:14px}
.liSub{font-size:12px;color:var(--ink-3)}
.liText{padding:4px 14px 12px;font-size:14px;line-height:1.43;white-space:pre-wrap;overflow-wrap:anywhere}
.liText .more{border:0;background:none;padding:0;color:var(--ink-3);font-family:var(--f-li);font-size:14px}
.liText .more:hover{color:var(--accent);text-decoration:underline}
.liImg img{display:block;width:100%;height:auto}
.liNoImg{margin:0 14px 14px;border:1px dashed var(--line-2);border-radius:6px;padding:28px 12px;text-align:center;color:var(--ink-3);font-size:13px}
.liPh{color:var(--ink-3);font-style:italic}

.checks{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--surface)}
.chk{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.chk:last-child{border-bottom:0}
.chk .ic{font-family:var(--f-display);font-weight:800;font-size:13px;text-align:center}
.chk.ok .ic{color:var(--st-ok)} .chk.warn .ic{color:var(--st-changes)} .chk.info .ic{color:var(--st-review)}
.chk .val{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:13px;white-space:nowrap}
.chk small{display:block;color:var(--ink-3);font-size:12.5px}
.prevActs{display:flex;gap:8px;flex-wrap:wrap}

/* comments */
.thread{padding:4px 20px 22px;border-top:1px solid var(--line)}
.thread h3{font-family:var(--f-display);font-weight:800;font-size:16px;margin:18px 0 12px}
.cm{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.av{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--surface-2)}
.cmHead{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:13px;color:var(--ink-3)}
.cmHead b{color:var(--ink);font-weight:600;font-size:14px}
.cmText{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.noCm{color:var(--ink-3);font-size:14px;padding:6px 0 10px}
.composer{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.composer textarea{min-height:70px}
.composer .acts{display:flex;justify-content:flex-end}
.dFoot{display:flex;justify-content:flex-end;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 20px 16px;border-top:1px solid var(--line)}

.picker{position:relative}
.hits{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--field);border:1px solid var(--line-2);border-radius:8px;box-shadow:var(--shadow);z-index:5;overflow:hidden}
.hits button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;padding:8px 10px;text-align:left}
.hits button:hover,.hits button:focus{background:var(--surface-2)}
.hits img{width:24px;height:24px;border-radius:50%}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:999px;padding:3px 6px 3px 4px;font-size:14px;background:var(--surface)}
.chip img{width:22px;height:22px;border-radius:50%}
.chip button{border:0;background:none;color:var(--ink-3);font-size:16px;line-height:1;padding:0 4px}
.note{font-size:13px;color:var(--ink-3)}

.banner{max-width:1320px;margin:0 auto 14px;padding:10px 14px;border-radius:8px;background:var(--st-changes-bg);color:var(--ink);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:20;box-shadow:var(--shadow)}

@media (max-width:1080px){.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .list{position:static;max-height:none}
  body.show-detail .list{display:none}
  body:not(.show-detail) .detail{display:none}
  .back{display:inline-flex}
  .row2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .row2 label:first-child{grid-column:1/-1}
  .cols{padding:16px}
  .dHead,.flow,.thread,.dFoot{padding-left:16px;padding-right:16px}
}

.topActs{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.who{display:flex;flex-direction:column;gap:4px}
.who select{width:180px}
.sync{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--ink-3);align-self:center}
.av.ini{display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:12px;color:var(--ink-2)}
.gate{max-width:760px;margin:24px auto;padding:28px 32px}
.gate h2{font-family:var(--f-display);font-weight:800;font-size:24px;margin:0 0 12px;letter-spacing:-.01em}
.gate p{color:var(--ink-2);margin:0 0 14px}
.gate ol{padding-left:20px;margin:0 0 20px;color:var(--ink-2)}
.gate li{margin:8px 0}
.gate code{font-size:13px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.folder{border-top:1px solid var(--line);padding:10px 14px;font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.folder b{color:var(--ink-2);font-weight:600}
.teamView{padding:20px 24px 28px;display:flex;flex-direction:column;gap:14px;max-width:760px}
.teamView h2{font-family:var(--f-display);font-weight:800;font-size:22px;margin:0}
.teamView h3{font-family:var(--f-display);font-weight:800;font-size:16px;margin:14px 0 0}
.teamView p{margin:0;color:var(--ink-2)}
.teamView .back{display:inline-flex}
.members{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--field)}
.mrow{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.members .noCm{padding:12px 14px}
.addRow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:8px}
.chkRow{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--field)}
.chkRow input{margin-top:4px;width:16px;height:16px;accent-color:var(--accent)}
.chkRow small{display:block;color:var(--ink-3);font-size:13px;margin-top:2px}
.notice{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border:1px solid var(--line-2);border-left:3px solid var(--st-review);border-radius:8px;padding:10px 12px;background:var(--field)}
a.btn{text-decoration:none;color:inherit}
.emp{display:flex;flex-direction:column;gap:8px}
.empRow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:start}
.empNo{font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--ink-3);padding-top:10px;text-align:center}
.empRow textarea{min-height:58px}
.empActs{display:flex;flex-direction:column;gap:4px}
.addEmp{align-self:flex-start}
@media (max-width:600px){.empRow{grid-template-columns:22px minmax(0,1fr)}.empActs{grid-column:2;flex-direction:row}}
.urlRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.urlRow .note{grid-column:1/-1}
a.btn.primary{color:var(--on-accent)}
@media (max-width:600px){.addRow{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="bar"></span><div><small>emst s.r.o. · LinkedIn a Instagram</small><h1>Plánovač príspevkov</h1></div></div>
  <div class="topActs" id="topActs" hidden>
    <label class="who"><span class="lab">Som</span><select id="meSel"></select></label>
    <button class="btn" id="teamBtn">Tím a upozornenia</button>
    <button class="btn primary" id="newPost">+ Nový príspevok</button>
    <div class="sync"><span id="syncState">Pripájam…</span><button class="btn ghost small" id="syncNow" title="Načítať zmeny od kolegov">Obnoviť</button></div>
  </div>
</header>
<div id="banner" class="banner" hidden></div>

<section class="panel gate" id="gate" hidden></section>

<div class="layout" id="layout" hidden>
  <aside class="panel list" aria-label="Príspevky">
    <div class="filters" role="group" aria-label="Filter">
      <button data-f="all" aria-pressed="true">Všetky <span class="count" id="c-all">0</span></button>
      <button data-f="review" aria-pressed="false">Na kontrole <span class="count" id="c-review">0</span></button>
      <button data-f="mine" aria-pressed="false">Čaká na mňa <span class="count" id="c-mine">0</span></button>
    </div>
    <div class="listBody" id="listBody"></div>
    <div class="folder" id="folderInfo"></div>
  </aside>
  <main class="panel detail" id="detail"></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="fileIn" accept="image/jpeg,image/png,image/webp" hidden>
<datalist id="people"></datalist>

<script type="application/json" id="seedData">[]</script>
<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(props||{})){
    if (v==null || v===false) continue;
    if (k==='class') el.className = v;
    else if (k==='text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v===true ? '' : v);
  }
  for (const kid of kids.flat()){
    if (kid==null || kid===false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

/* ---------- reading changes from the folder ---------- */
async function syncAll(){
  if (!S.dirs || S.syncing) return; S.syncing=true;
  let changed=false;
  try{
    await loadTeam(false);
    const found=new Set();
    for await (const [name, fh] of S.dirs.posts.entries()){
      if (fh.kind!=='file' || !name.endsWith('.json')) continue;
      const id=name.slice(0,-5); found.add(id);
      const f=await fh.getFile(); const key=f.lastModified+':'+f.size;
      if (S.seen.get('p:'+id)===key) continue;
      let p; try{ p=JSON.parse(await f.text()); }catch(e){ continue; }   // file still syncing, try next round
      S.seen.set('p:'+id, key);
      if (!p || p.id!==id) continue;                                   // OneDrive conflict copies are ignored
      const pend=S.pending.get(id), local=S.posts.get(id);
      if (pend && pend.size && local) for (const k of pend) p[k]=local[k];
      S.posts.set(id, p); changed=true;
    }
    for (const id of [...S.posts.keys()]){
      if (!found.has(id) && !(S.pending.get(id)||new Set()).size && !S.timers.has(id)){ S.posts.delete(id); changed=true; }
    }
    for await (const [pid, dh] of S.dirs.comments.entries()){
      if (dh.kind!=='directory') continue;
      for await (const [cn, ch] of dh.entries()){
        const key='c:'+pid+'/'+cn; if (ch.kind!=='file' || S.seen.has(key)) continue;
        let c; try{ c=JSON.parse(await (await ch.getFile()).text()); }catch(e){ continue; }
        S.seen.set(key,1);
        const list=S.comments.get(pid)||[]; list.push(c); list.sort((a,b)=>a.at-b.at); S.comments.set(pid,list); changed=true;
        if (pid===S.builtFor) S.cmDirty=true;
      }
    }
    S.lastSync=Date.now(); setSync('Synchronizované '+hm(S.lastSync));
  }catch(e){ setSync('Priečinok nie je dostupný'); }
  finally{ S.syncing=false; }
  if (changed){ refreshPeople(); renderList(); renderDetail(); if (S.cmDirty){ S.cmDirty=false; drawComments(); } }
}

/* ---------- writing ---------- */
function setLocal(id, fields, delay){
  const p=S.posts.get(id); if(!p) return;
  Object.assign(p, fields, {updatedAt:Date.now(), updatedBy:me()||p.updatedBy||null});
  const set=S.pending.get(id)||new Set(); Object.keys(fields).concat(['updatedAt','updatedBy']).forEach(k=>set.add(k)); S.pending.set(id,set);
  clearTimeout(S.timers.get(id));
  S.timers.set(id, setTimeout(()=>flush(id), delay==null?800:delay));
  setSync('Ukladám…');
}
async function flush(id){
  clearTimeout(S.timers.get(id)); S.timers.delete(id);
  const fields=S.pending.get(id); if (!fields || !fields.size) return;
  S.pending.set(id, new Set());
  const local=S.posts.get(id); if (!local) return;
  try{
    const fh=await S.dirs.posts.getFileHandle(id+'.json',{create:true});
    let base=null;
    try{ const f=await fh.getFile(); if (f.size && S.seen.get('p:'+id)!==f.lastModified+':'+f.size){ const b=JSON.parse(await f.text()); if (b && b.id===id) base=b; } }catch(e){}
    const out=base ? Object.assign({}, base) : Object.assign({}, local);
    if (base) for (const k of fields) out[k]=local[k];
    const w=await fh.createWritable(); await w.write(JSON.stringify(out,null,1)); await w.close();
    const f2=await fh.getFile(); S.seen.set('p:'+id, f2.lastModified+':'+f2.size);
    const now=S.posts.get(id)||out, pend=S.pending.get(id)||new Set();
    const merged=Object.assign({}, out); for (const k of pend) merged[k]=now[k];
    S.posts.set(id, merged);
    setSync('Uložené '+hm(Date.now()));
    if (base){ renderList(); renderDetail(); }
  }catch(e){
    const set=S.pending.get(id)||new Set(); fields.forEach(k=>set.add(k)); S.pending.set(id,set);
    setSync('Neuložené, skúšam znova…');
    S.timers.set(id, setTimeout(()=>flush(id), 5000));
  }
}
async function writeComment(pid, c){
  try{
    const dir=await S.dirs.comments.getDirectoryHandle(pid,{create:true});
    const name=c.at+'-'+Math.random().toString(36).slice(2,8)+'.json';
    const fh=await dir.getFileHandle(name,{create:true}); const w=await fh.createWritable(); await w.write(JSON.stringify(c,null,1)); await w.close();
    S.seen.set('c:'+pid+'/'+name,1);
    const list=S.comments.get(pid)||[]; list.push(c); list.sort((a,b)=>a.at-b.at); S.comments.set(pid,list);
    refreshPeople(); if (pid===S.builtFor) drawComments();
    return true;
  }catch(e){ toast('Komentár sa nepodarilo uložiť do priečinka.'); return false; }
}

async function setStatus(status, kind, text, to, extra){
  if (needName()) return;
  const id=S.builtFor; if(!id) return;
  setLocal(id, Object.assign({status}, extra||{}), 0);
  await flush(id);
  if (kind) await writeComment(id, {kind, text:text||'', author:me(), to:to||null, at:Date.now()});
  S.ui.send=false; S.ui.decide=null; S.ui.notice=null;
  const p=S.posts.get(id);
  const target = kind==='sent' ? to : (kind==='changes'||kind==='approve') ? (p && p.createdBy) : null;
  if (p && target && !same(target, me())) S.ui.notice=await buildNotice(kind, p, target, text);
  S.flowKey=null; refreshPeople(); renderList(); renderDetail();
}
async function buildNotice(kind, p, toName, text){
  const m=member(toName), from=member(me());
  const title=p.title||'Bez názvu', when=fmtLong(pDate(p.date));
  const subject = kind==='sent' ? 'Na kontrolu: '+title : kind==='changes' ? 'Na úpravu: '+title : 'Schválené: '+title;
  const lead = kind==='sent' ? me()+' ti poslal/a na kontrolu príspevok „'+title+'“ ('+when+').'
    : kind==='changes' ? me()+' vrátil/a príspevok „'+title+'“ ('+when+') na úpravu.'
    : me()+' schválil/a príspevok „'+title+'“ ('+when+').';
  const link = WEB ? location.href.split('#')[0]+'#p='+p.id : (m && m.fileUrl ? m.fileUrl+'#p='+p.id : '');
  const body = lead + (text ? '\n'+(kind==='changes'?'Komentár: ':'Správa: ')+text : '')
    + (link ? (WEB ? '\n\nOtvoriť príspevok:\n' : '\n\nOtvoriť príspevok (ak sa odkaz neotvorí kliknutím, skopíruj ho do Chrome alebo Edge):\n')+link
            : '\nOtvor plánovač príspevkov, príspevok sa ti otvorí sám (nájdeš ho aj pod „Čaká na mňa“).' + (S.team.plannerUrl ? '\nPlánovač: '+S.team.plannerUrl : ''));
  const n={type:kind, at:new Date().toISOString(), toName, toEmail:(m&&m.email)||'', fromName:me(), fromEmail:(from&&from.email)||'', postTitle:title, postDate:p.date||'', subject, message:body};
  await writeNotification(n);
  return n;
}

/* ---------- photos ---------- */
async function photoUrl(name){
  if (!name) return null;
  if (S.photoUrls.has(name)) return S.photoUrls.get(name);
  try{ const f=await (await S.dirs.photos.getFileHandle(name)).getFile(); if(!f.size) return null; const u=URL.createObjectURL(f); S.photoUrls.set(name,u); return u; }
  catch(e){ return null; }
}
async function renderPhoto(p){
  const box=$('#d-photo'); if(!box) return;
  const key=(p.photo||'')+'|'+(S.ui.uploading?1:0)+'|'+(S.photoUrls.has(p.photo)?1:0);
  if (S.photoKey===key) return; S.photoKey=key;
  const wrap=h('div',{class:'photo'});
  if (S.ui.uploading) wrap.append(h('p',{text:'Ukladám fotku…'}));
  else if (p.photo){
    const u=await photoUrl(p.photo);
    if (S.builtFor!==p.id) return;
    wrap.append(u ? h('img',{src:u,alt:'Fotka k príspevku'}) : h('p',{text:'Fotka sa ešte synchronizuje z OneDrive…'}),
      h('div',{class:'acts'}, h('button',{class:'btn small',onclick:pickFile,text:'Vymeniť fotku'}), h('button',{class:'btn small danger',onclick:removePhoto,text:'Odstrániť'})));
    if (!u) S.photoKey=null;
  } else wrap.append(h('p',{text:'Pretiahni sem fotku alebo vizuál z Canvy (JPG, PNG, WebP).'}), h('button',{class:'btn small',onclick:pickFile,text:'Nahrať fotku'}));
  wrap.addEventListener('dragover',e=>{e.preventDefault();wrap.classList.add('drag');});
  wrap.addEventListener('dragleave',()=>wrap.classList.remove('drag'));
  wrap.addEventListener('drop',e=>{e.preventDefault();wrap.classList.remove('drag');const f=e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) addPhoto(f);});
  box.replaceChildren(wrap);
}
function pickFile(){ const f=$('#fileIn'); f.value=''; f.click(); }
$('#fileIn').addEventListener('change',e=>{ const f=e.target.files[0]; if(f) addPhoto(f); });
function addPhoto(file){
  const id=S.builtFor; const p=S.posts.get(id); if(!p) return;
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)){ toast('Použi fotku vo formáte JPG, PNG alebo WebP.'); return; }
  S.ui.uploading=true; S.photoKey=null; renderPhoto(p);
  const img=new Image(); const url=URL.createObjectURL(file);
  img.onload=()=>{
    const max=2160, k=Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
    const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    c.toBlob(async blob=>{
      try{
        const name=id+'-'+Date.now().toString(36)+'.jpg';
        const fh=await S.dirs.photos.getFileHandle(name,{create:true}); const w=await fh.createWritable(); await w.write(blob); await w.close();
        const old=p.photo;
        setLocal(id,{photo:name},0); await flush(id);
        if (old && old!==name){ try{ await S.dirs.photos.removeEntry(old); }catch(e){} }
        toast('Fotka uložená do priečinka.');
      }catch(e){ toast('Fotku sa nepodarilo uložiť do priečinka.'); }
      S.ui.uploading=false; S.photoKey=null; const q=S.posts.get(id); if(q && S.builtFor===id){ renderPhoto(q); updatePreview(); }
    },'image/jpeg',0.9);
  };
  img.onerror=()=>{ URL.revokeObjectURL(url); S.ui.uploading=false; S.photoKey=null; renderPhoto(p); toast('Fotku sa nepodarilo načítať.'); };
  img.src=url;
}
async function removePhoto(){
  const id=S.builtFor; const p=S.posts.get(id); if(!p||!p.photo) return;
  const old=p.photo; setLocal(id,{photo:null},0); await flush(id);
  try{ await S.dirs.photos.removeEntry(old); }catch(e){}
  S.photoKey=null; renderDetail();
}

/* ---------- preview + checks ---------- */
async function updatePreview(){
  const p=S.posts.get(S.builtFor); if(!p) return;
  const el=$('#f-text'); const text=el? el.value : (p.text||'');
  const d=pDate(($('#f-date')||{}).value||p.date);
  const prev=$('#d-preview'); if(!prev) return;
  const lines=text.split('\n');
  let short=lines.slice(0,3).join('\n'); if(short.length>210) short=short.slice(0,210).replace(/\s+\S*$/,'');
  const truncated = short.length < text.trimEnd().length;
  const tx=h('div',{class:'liText'});
  if (!text.trim()) tx.append(h('span',{class:'liPh',text:'Text príspevku sa zobrazí tu.'}));
  else if (truncated && !S.ui.expanded) tx.append(short.trimEnd(),'… ',h('button',{class:'more',onclick:()=>{S.ui.expanded=true;updatePreview();},text:'viac'}));
  else { tx.append(text); if(truncated) tx.append(' ',h('button',{class:'more',onclick:()=>{S.ui.expanded=false;updatePreview();},text:'menej'})); }
  const imgBox = p.photo ? h('div',{class:'liImg'}) : h('div',{class:'liNoImg',text:'Bez fotky'});
  prev.replaceChildren(h('div',{class:'li'},
    h('div',{class:'liHead'}, h('div',{class:'liLogo',text:'emst'}), h('div',{}, h('div',{class:'liName',text:'emst s.r.o.'}), h('div',{class:'liSub',text:fmtLong(d)}))),
    tx, imgBox));
  renderChecks(p,text,d);
  if (p.photo){ const u=await photoUrl(p.photo); if(u) imgBox.append(h('img',{src:u,alt:''})); else imgBox.replaceWith(h('div',{class:'liNoImg',text:'Fotka sa synchronizuje…'})); }
}
function renderChecks(p,text,d){
  const box=$('#d-checks'); if(!box) return;
  const n=[...text].length;
  const tags=(text.match(/#[\p{L}\p{N}_]+/gu)||[]).length;
  const tail=text.trim().slice(-400);
  const typeV=($('#f-type')||{}).value||p.type;
  const wd=d? d.getDay() : null;
  const rows=[];
  rows.push(n>3000 ? ['warn','Text je dlhší, ako LinkedIn dovolí','max. 3 000 znakov',n+' / 3 000'] : ['ok','Dĺžka textu','LinkedIn dovolí najviac 3 000 znakov',n+' / 3 000']);
  rows.push(tags>=3&&tags<=5 ? ['ok','Hashtagy','',String(tags)] : ['info','Hashtagy', tags<3?'Pridaj aspoň 3, odporúčame 3 až 5':'Odporúčame 3 až 5', String(tags)]);
  rows.push(/[?？]/.test(tail) ? ['ok','Otázka na konci','pomáha rozbehnúť diskusiu',''] : ['info','Chýba otázka na konci','pridaj otázku pre čitateľov','']);
  rows.push(/\*/.test(text) ? ['warn','Text obsahuje hviezdičky *','LinkedIn nezobrazí tučné písmo, hviezdičky ostanú viditeľné',''] : ['ok','Bez hviezdičiek *','formátovanie sa zobrazí správne','']);
  rows.push(p.photo ? ['ok','Fotka je pridaná','',''] : ['warn','Chýba fotka','','']);
  const ec=(Array.isArray(p.empComments)?p.empComments:[]).filter(x=>x&&x.trim()).length;
  rows.push(ec>=3 ? ['ok','Komentáre pre zamestnancov','',String(ec)] : ['info','Komentáre pre zamestnancov','priprav 3 až 4 komentáre',String(ec)]);
  if (wd===null) rows.push(['info','Dátum nie je nastavený','','']);
  else if (typeV==='Referencia') rows.push(wd===5 ? ['ok','Referencia v piatok','podľa plánu',''] : ['info','Referencia nie je v piatok','plán: referencie v piatok',fmtWd(d)]);
  else rows.push(wd===2 ? ['ok','Utorok','podľa plánu',''] : ['info','Iný deň ako utorok','plán: odborné príspevky v utorok',fmtWd(d)]);
  const sym={ok:'✓',warn:'!',info:'i'};
  box.replaceChildren(...rows.map(([st,t,s,v])=>h('div',{class:'chk '+st}, h('span',{class:'ic',text:sym[st]}), h('span',{}, t, s?h('small',{text:s}):null), h('span',{class:'val',text:v}))));
}
function readEmp(){ return [...document.querySelectorAll('#d-emp textarea')].map(t=>t.value); }
function setEmp(arr, focusLast){
  setLocal(S.builtFor, {empComments:arr}, 0);
  const p=S.posts.get(S.builtFor); renderEmp(p, true); updatePreview();
  if (focusLast){ const t=[...document.querySelectorAll('#d-emp textarea')].pop(); if(t) t.focus(); }
}
function renderEmp(p, force){
  const box=$('#d-emp'); if(!box || !p) return;
  const pend=S.pending.get(p.id)||new Set();
  if (!force && (box.contains(document.activeElement) || pend.has('empComments'))) return;
  const list=(Array.isArray(p.empComments) && p.empComments.length) ? p.empComments.slice() : ['','',''];
  const key=JSON.stringify(list); if (!force && box.dataset.key===key) return; box.dataset.key=key;
  const rows=list.map((txt,i)=>{
    const ta=h('textarea',{rows:'2',placeholder:'Komentár '+(i+1),'aria-label':'Komentár pre zamestnancov '+(i+1)}); ta.value=txt||'';
    ta.addEventListener('input',()=>{ const arr=readEmp(); box.dataset.key=JSON.stringify(arr); setLocal(S.builtFor,{empComments:arr},800); updatePreview(); });
    ta.addEventListener('blur',()=>{ if (S.timers.has(S.builtFor)) flush(S.builtFor); });
    return h('div',{class:'empRow'}, h('span',{class:'empNo',text:String(i+1)}), ta,
      h('div',{class:'empActs'},
        h('button',{class:'btn small',onclick:()=>copyStr(ta.value, ta),text:'Kopírovať'}),
        list.length>1 ? h('button',{class:'btn small ghost','aria-label':'Odstrániť komentár '+(i+1),onclick:()=>{ const arr=readEmp(); arr.splice(i,1); setEmp(arr,false); },text:'Odstrániť'}) : null));
  });
  box.replaceChildren(...rows, list.length<6 ? h('button',{class:'btn small ghost addEmp',onclick:()=>{ const arr=readEmp(); arr.push(''); setEmp(arr,true); },text:'+ Pridať komentár'}) : null);
}
async function copyStr(t, el){
  if (!t || !t.trim()){ toast('Komentár je prázdny.'); return; }
  try { await navigator.clipboard.writeText(t); toast('Komentár skopírovaný'); }
  catch(e){ if(el){ el.focus(); el.select(); } toast('Text je označený, skopíruj ho cez Ctrl+C.'); }
}
async function copyText(){
  const el=$('#f-text'); const t=el? el.value : '';
  try { await navigator.clipboard.writeText(t); toast('Text skopírovaný'); }
  catch(e){ if(el){ el.focus(); el.select(); } toast('Text je označený, skopíruj ho cez Ctrl+C.'); }
}

/* ---------- comments ---------- */
function initials(n){ return (n||'?').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase(); }
function drawComments(){
  const box=$('#d-comments'); if(!box) return;
  const list=(S.comments.get(S.builtFor)||[]).slice();
  if (!list.length){ box.replaceChildren(h('div',{class:'noCm',text:'Zatiaľ bez komentárov.'})); return; }
  box.replaceChildren(...list.map(c=>h('div',{class:'cm'},
    h('span',{class:'av ini',text:initials(c.author)}),
    h('div',{}, h('div',{class:'cmHead'}, h('b',{text:c.author||'Niekto'}),
        KIND[c.kind] ? h('span',{class:'pill '+(KIND_CLS[c.kind]||'st-draft'),text:KIND[c.kind]+(c.kind==='sent'&&c.to?' → '+c.to:'')}) : null,
        h('span',{text:fmtTime(c.at)})),
      c.text ? h('div',{class:'cmText',text:c.text}) : null))));
}
async function addComment(){
  const ta=$('#c-text'); const t=ta.value.trim();
  if (!t){ ta.focus(); return; }
  if (needName()) return;
  if (await writeComment(S.builtFor, {kind:'comment', text:t, author:me(), at:Date.now()})) ta.value='';
}

/* ---------- delete ---------- */
function renderFoot(p){
  const f=$('#d-foot'); if(!f) return;
  if (!S.ui.confirmDel){ f.replaceChildren(h('button',{class:'btn small danger',onclick:()=>{S.ui.confirmDel=true;renderFoot(p);},text:'Vymazať príspevok'})); return; }
  f.replaceChildren(h('span',{class:'note',text:'Naozaj vymazať aj s komentármi a fotkou? Zmizne aj kolegovi.'}),
    h('button',{class:'btn small',onclick:()=>{S.ui.confirmDel=false;renderFoot(p);},text:'Nechať'}),
    h('button',{class:'btn small primary',onclick:()=>deletePost(p.id),text:'Vymazať'}));
}
async function deletePost(id){
  const p=S.posts.get(id); if(!p) return;
  clearTimeout(S.timers.get(id)); S.timers.delete(id); S.pending.delete(id);
  try{
    try{ await S.dirs.posts.removeEntry(id+'.json'); }catch(e){}
    try{ await S.dirs.comments.removeEntry(id,{recursive:true}); }catch(e){}
    if (p.photo){ try{ await S.dirs.photos.removeEntry(p.photo); }catch(e){} }
    S.posts.delete(id); S.comments.delete(id);
    select(null); toast('Príspevok vymazaný');
  }catch(e){ toast('Príspevok sa nepodarilo vymazať.'); }
}

/* ---------- personal links ---------- */
async function rememberMyUrl(){
  const name=me(); if (!name || location.protocol!=='file:') return;
  const url=location.href.split('#')[0];
  const m=member(name); if (!m || m.fileUrl===url) return;
  await saveTeam(t=>{ const x=(t.members||[]).find(y=>same(y.name,name)); if (x) x.fileUrl=url; });
}
function openFromHash(){
  const m=/[#&]p=([A-Za-z0-9_-]+)/.exec(location.hash||''); if (!m) return false;
  const id=m[1]; if (!S.posts.has(id)) return false;
  S.filter='all'; document.querySelectorAll('.filters button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.f==='all')));
  select(id);
  try{ history.replaceState(null,'',location.href.split('#')[0]); }catch(e){}
  return true;
}
window.addEventListener('hashchange',()=>{ if (S.dirs) openFromHash(); });

/* ---------- open what is waiting for me ---------- */
function focusWaiting(){
  if (!me() || S.view==='team') return;
  const waiting=[...S.posts.values()].filter(isMine).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  const b=$('#banner');
  if (!waiting.length){ if (b.dataset.kind==='waiting'){ b.hidden=true; b.dataset.kind=''; } return; }
  S.filter='mine'; document.querySelectorAll('.filters button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.f==='mine')));
  select(waiting[0].id);
  b.dataset.kind='waiting'; b.hidden=false;
  b.replaceChildren(waiting.length===1 ? 'Na teba čaká 1 príspevok, je otvorený nižšie.' : 'Na teba čakajú '+waiting.length+' príspevky. Najnovší je otvorený, ostatné sú v zozname „Čaká na mňa“.',
    ' ', h('button',{class:'btn ghost small',onclick:()=>{b.hidden=true;b.dataset.kind='';},text:'Zavrieť'}));
}

/* ---------- top bar ---------- */
$('#newPost').addEventListener('click', async()=>{
  const p={id:uid(), date:nextTuesday(), type:'Technický', channel:'LinkedIn', title:'Nový príspevok', text:'', notes:'', photo:null,
    status:'draft', reviewer:null, createdBy:me()||null, createdAt:Date.now(), updatedAt:Date.now(), updatedBy:me()||null};
  S.posts.set(p.id,p); S.pending.set(p.id,new Set(Object.keys(p)));
  select(p.id); await flush(p.id);
  setTimeout(()=>{ const t=$('#f-title'); if(t){ t.focus(); t.select(); } },50);
});
$('#syncNow').addEventListener('click', ()=>syncAll());
document.querySelectorAll('.filters button').forEach(b=>b.addEventListener('click',()=>{
  S.filter=b.dataset.f; document.querySelectorAll('.filters button').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); renderList();
}));
$('#meSel').addEventListener('change',()=>{ S.meName=$('#meSel').value; ls('emst-planovac-meno', S.meName); rememberMyUrl(); renderList(); if (S.builtFor){ S.flowKey=null; renderFlow(S.posts.get(S.builtFor)); } focusWaiting(); });
$('#teamBtn').addEventListener('click', openTeam);
window.addEventListener('focus', ()=>syncAll());
window.addEventListener('beforeunload', e=>{ if (S.timers.size){ for (const id of [...S.timers.keys()]) flush(id); e.preventDefault(); e.returnValue=''; } });

/* ---------- start ---------- */
(async function boot(){
  if (!('showDirectoryPicker' in window)){ gate('browser'); return; }
  if (!WEB && location.protocol!=='file:'){ gate('first'); return; }
  const handle=await idbGet('root');
  if (handle){
    try{ if (await handle.queryPermission({mode:'readwrite'})==='granted'){ await connect(handle); return; } }catch(e){}
    gate('resume', handle); return;
  }
  gate('first');
})();
})();
</script>
